name: Canary Release

on:
  push:
    branches: [v10]
  workflow_dispatch:

permissions:
  id-token: write # Required for npm OIDC
  contents: read

jobs:
  canary:
    name: Publish canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC
        run: npm install -g npm@latest

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm build

      # The version is derived per package rather than shared: fiber and test-renderer are on 9.x and
      # eslint-plugin on 0.x, and npm versions cannot be withdrawn. Each canary is a prerelease of the
      # package's next patch (9.8.1 -> 9.8.2-canary.<sha>), so it sorts above the current release and
      # below the next one. A manifest already on a prerelease (9.9.0-beta.1) canaries its own base (9.9.0).
      - name: Set canary versions
        run: |
          SHA="$(git rev-parse --short HEAD)"
          for pkg in fiber eslint-plugin test-renderer; do
            BASE="$(node -p "
              const [core, pre] = require('./packages/$pkg/package.json').version.split('+')[0].split(/-(.*)/)
              const [major, minor, patch] = core.split('.').map(Number)
              pre ? core : [major, minor, patch + 1].join('.')
            ")"
            VERSION="$BASE-canary.$SHA"
            echo "Publishing @react-three/$pkg as $VERSION"
            (cd "packages/$pkg" && npm version "$VERSION" --no-git-tag-version)
          done

      - name: Publish to npm
        run: |
          pnpm --filter @react-three/fiber publish --tag canary --no-git-checks --provenance
          pnpm --filter @react-three/eslint-plugin publish --tag canary --no-git-checks --provenance
          pnpm --filter @react-three/test-renderer publish --tag canary --no-git-checks --provenance
