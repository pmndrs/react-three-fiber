name: Test
on:
  push:
    branches:
      - 'master'
  pull_request: {}
jobs:
  build:
    name: Build, lint, and test (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react-version:
          - 19.0.0
          - latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set React version (${{ matrix.react-version }})
        run: |
          npm pkg set devDependencies.react=${{ matrix.react-version }}
          npm pkg set devDependencies.react-dom=${{ matrix.react-version }}

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      # Keep CI in lockstep with the local `pnpm ci` gate (see docs/development/TESTING.md
      # → Local ↔ CI parity). These run locally but were previously CI-only gaps.
      - name: Verify bundles
        run: pnpm run verify-bundles

      - name: Verify types
        run: pnpm run verify-types

      - name: Check types
        run: pnpm run typecheck

      - name: Check lint
        run: pnpm run eslint

      - name: Test (with coverage)
        run: pnpm run dev && pnpm run test

      - name: Upload coverage report
        if: ${{ matrix.react-version == 'latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Report Fiber size
        run: pnpm run analyze-fiber

      - name: Report Test Renderer size
        run: pnpm run analyze-test

      - name: Check formatting
        run: pnpm run format
