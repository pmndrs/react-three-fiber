name: Test
on:
  push:
    branches:
      - 'master'
  pull_request: {}
jobs:
  build:
    name: Build, lint, and test (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react-version:
          - 19.0.0
          - latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set React version (${{ matrix.react-version }})
        run: |
          npm pkg set devDependencies.react=${{ matrix.react-version }}
          npm pkg set devDependencies.react-dom=${{ matrix.react-version }}

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      # Keep CI in lockstep with the local `pnpm run ci` gate (see docs/development/TESTING.md
      # → Local ↔ CI parity). These run locally but were previously CI-only gaps.
      - name: Verify bundles
        run: pnpm run verify-bundles

      - name: Verify types
        run: pnpm run verify-types

      - name: Check types
        run: pnpm run typecheck

      - name: Check lint
        run: pnpm run eslint

      - name: Test (with coverage)
        run: pnpm run dev && pnpm run test

      - name: Upload coverage report
        if: ${{ matrix.react-version == 'latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Report Fiber size
        run: pnpm run analyze-fiber

      - name: Report Test Renderer size
        run: pnpm run analyze-test

      - name: Check formatting
        run: pnpm run format

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Enforce the readme-stub contract: every source readme is a thin pointer to
      # the canonical docs, never a second copy of the docs (the "drift rule").
      - name: Assert readme stubs link to docs and stay small
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(grep -c "Full documentation:" "$f" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$f::readme must contain exactly one 'Full documentation:' link (found $n)"
              fail=1
            fi
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 15 ]; then
              echo "::error file=$f::readme exceeds the 15-line stub budget ($lines lines) — move usage content into docs/"
              fail=1
            fi
          done < <(find packages -path '*readmes*' -name '*.md')
          exit $fail

      # Check external links in docs + readmes. The production docs host is excluded
      # (those pages are validated after deploy), and only http(s) links are checked
      # so the site-relative routes (/frame-loop, /api/canvas, ...) the docs renderer
      # resolves are not flagged here.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme http
            --scheme https
            --exclude 'docs\.pmnd\.rs'
            'docs/**/*.md'
            'docs/**/*.mdx'
            'packages/**/readmes/*.md'
          fail: true
