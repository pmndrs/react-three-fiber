name: Build documentation and deploy to GitHub Pages

# One Pages site serves two release lines, each built from its own branch:
#
#   /       built from `master` (stable)
#   /next   built from NEXT_REF (prerelease, currently `v10`)
#
# The version switcher of @pmndrs/docs links them, labelled with their branch names.
#
# A repo has a single Pages site and every deploy replaces all of it, so both are always built and
# deployed together, and only from `master`. A push to NEXT_REF therefore doesn't deploy anything
# itself: it dispatches this workflow on `master`, which rebuilds both. Keep this file identical on
# both branches.
#
# When the next prerelease line starts (v11), point NEXT_REF at it, along with the two places that
# spell it out below (`on.push.branches` and the dispatch job's `if:`, where `env` isn't
# available). /next stays its URL.
#
# Pull requests don't touch Pages: each one gets its own Vercel preview instead (`preview` job).

on:
  push:
    branches: ['master', 'v10'] # 'v10' is NEXT_REF spelled out
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
# A pull request's ref is `refs/pull/<n>/merge`, so its runs never cancel a master deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What every build shares; what differs per build is set on its own step.
env:
  NEXT_PUBLIC_LIBNAME: 'React Three Fiber'
  NEXT_PUBLIC_LIBNAME_SHORT: 'r3f'
  HOME_REDIRECT: '/getting-started/introduction'
  ICON: '🇨🇭'
  LOGO: '/logo.jpg'
  GITHUB: 'https://github.com/pmndrs/react-three-fiber'
  DISCORD: 'https://discord.com/channels/740090768164651008/740093168770613279'
  THEME_PRIMARY: '#323e48'
  THEME_SCHEME: 'tonalSpot'
  THEME_CONTRAST: '0'
  THEME_NOTE: '#1f6feb'
  THEME_TIP: '#238636'
  THEME_IMPORTANT: '#8957e5'
  THEME_WARNING: '#d29922'
  THEME_CAUTION: '#da3633'
  CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}
  # Version label in the sidebar footer: the latest vX.Y.Z tag, not the legacy
  # @react-three/fiber@X.Y.Z ones
  TAG_MATCH: 'v*.*.*'
  # Version switcher: master is served at the root, and the one prerelease line at /next. No
  # `{branch}` placeholder: the URL is the same whichever branch it is built from.
  VERSION_URL_TEMPLATE: 'https://r3f.docs.pmnd.rs/next'
  VERSION_PRODUCTION_BRANCH: 'master'
  VERSION_PRODUCTION_URL: 'https://r3f.docs.pmnd.rs'
  # The prerelease branch built at /next
  NEXT_REF: v10

jobs:
  dispatch:
    name: Rebuild from master
    if: github.event_name == 'push' && github.ref_name == 'v10' # NEXT_REF spelled out
    runs-on: ubuntu-latest
    permissions:
      actions: write # to dispatch this workflow on master
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'pull_request' && github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      # Full history and tags for the version label (`git describe --tags`), but blobless: past
      # file contents are not fetched, only the checked-out commit's
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.NEXT_REF }}
          path: next
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Built first, so that master's switcher offers the prerelease line only when it was built:
      # a broken prerelease build must never hold back the master docs.
      - name: Build ${{ env.NEXT_REF }} docs
        id: next
        continue-on-error: true
        working-directory: next
        # @pmndrs/docs reads the current branch from GITHUB_REF_NAME, which is `master` in this
        # run. GITHUB_* variables can't be overridden in `env:`, hence on the command line.
        run: GITHUB_REF_NAME="$NEXT_REF" npx -y @pmndrs/docs@4 build docs ../_site/next --format website
        env:
          BASE_PATH: /next
          NEXT_PUBLIC_URL: https://r3f.docs.pmnd.rs/next
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ env.NEXT_REF }}/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ env.NEXT_REF }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ env.NEXT_REF }}/docs
          VERSION_BRANCHES_LIST: master ${{ env.NEXT_REF }}

      - name: Deploy without ${{ env.NEXT_REF }} docs
        if: steps.next.outcome != 'success'
        run: |
          echo "::warning::$NEXT_REF docs failed to build; deploying master docs only"
          rm -rf _site/next

      - name: Build master docs
        run: npx -y @pmndrs/docs@4 build docs _site --format website
        env:
          NEXT_PUBLIC_URL: https://r3f.docs.pmnd.rs
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/master/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/master
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/master/docs
          VERSION_BRANCHES_LIST: ${{ steps.next.outcome == 'success' && format('master {0}', env.NEXT_REF) || 'master' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A Vercel preview of the pull request's docs, at https://r3f-docs-git-<branch slug>-pmndrs.vercel.app
  # (Vercel only makes branch URLs for its Git integration, not for CLI deploys, so this job sets
  # that alias itself). Only for branches of this repo: a fork's pull request gets no secrets.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment:
      name: Preview
      url: ${{ steps.alias.outputs.url || steps.deploy.outputs.url }}

    steps:
      # Without the Vercel secrets there is nothing to deploy to: skip, rather than fail the PR.
      - id: vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::No VERCEL_TOKEN secret; skipping the Vercel preview"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The alias hostname, from the same slug rule as `{branch}` in @pmndrs/docs: lowercase, every
      # run of characters other than [a-z0-9] becomes one `-`, none at either end.
      - id: slug
        if: steps.vercel.outputs.enabled == 'true'
        run: |
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "host=r3f-docs-git-$slug-pmndrs.vercel.app" >> "$GITHUB_OUTPUT"
        env:
          # Through env rather than inline: a branch name is picked by the pull request's author
          BRANCH: ${{ github.head_ref }}

      # Full history and tags for the version label, as in the build job
      - uses: actions/checkout@v6
        if: steps.vercel.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v6
        if: steps.vercel.outputs.enabled == 'true'
        with:
          node-version: 24

      # The Vercel secrets are given only to the steps that deploy, never to this one: it runs
      # the pull request's own MDX.
      #
      # Not on the production branch, so the preview shows the "you're viewing <branch>" banner,
      # and its switcher leads to the production docs.
      - name: Build docs
        if: steps.vercel.outputs.enabled == 'true'
        run: npx -y @pmndrs/docs@4 build docs out --format website
        env:
          NEXT_PUBLIC_URL: https://${{ steps.slug.outputs.host }}
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.event.pull_request.head.sha }}/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.head_ref }}/docs
          VERSION_BRANCHES_LIST: master ${{ env.NEXT_REF }}

      - name: Deploy to Vercel
        id: deploy
        if: steps.vercel.outputs.enabled == 'true'
        # cleanUrls: serve /foo from foo.html, as Pages does
        run: |
          echo '{ "cleanUrls": true }' > out/vercel.json
          url=$(npx -y vercel deploy out --target=preview --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Not fatal: a branch name too long for a 63-character hostname label cannot get its alias,
      # and that is no reason to fail the pull request.
      - name: Alias the preview to its branch URL
        id: alias
        if: steps.vercel.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          npx -y vercel alias set "$DEPLOYMENT_URL" "$ALIAS" --token="$VERCEL_TOKEN" --scope=pmndrs
          echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.slug.outputs.host }}
