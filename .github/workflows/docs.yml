name: Build documentation and deploy to GitHub Pages

# One Pages site serves two release lines, each built from its own branch:
#
#   /      built from `master` (stable)
#   /v10   built from `v10` (prerelease)
#
# The version switcher of @pmndrs/docs links them: its URL template sends every branch other than
# `master` to /<branch>. Another release line is one more checkout and build below, plus its name
# in `on.push.branches`, the dispatch job and VERSION_BRANCHES_LIST.
#
# A repo has a single Pages site and every deploy replaces all of it, so both are always built and
# deployed together, and only from `master`. A push to `v10` therefore doesn't deploy anything
# itself: it dispatches this workflow on `master`, which rebuilds both. Keep this file identical on
# both branches.

on:
  push:
    branches: ['master', 'v10']
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Rebuild from master
    if: github.ref_name == 'v10'
    runs-on: ubuntu-latest
    permissions:
      actions: write # to dispatch this workflow on master
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest

    # What both builds share; what differs per branch is set on each build step.
    env:
      NEXT_PUBLIC_LIBNAME: 'React Three Fiber'
      NEXT_PUBLIC_LIBNAME_SHORT: 'r3f'
      HOME_REDIRECT: '/getting-started/introduction'
      ICON: '🇨🇭'
      LOGO: '/logo.jpg'
      GITHUB: 'https://github.com/pmndrs/react-three-fiber'
      DISCORD: 'https://discord.com/channels/740090768164651008/740093168770613279'
      THEME_PRIMARY: '#323e48'
      THEME_SCHEME: 'tonalSpot'
      THEME_CONTRAST: '0'
      THEME_NOTE: '#1f6feb'
      THEME_TIP: '#238636'
      THEME_IMPORTANT: '#8957e5'
      THEME_WARNING: '#d29922'
      THEME_CAUTION: '#da3633'
      CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Version label in the sidebar footer: the latest vX.Y.Z tag, not the legacy
      # @react-three/fiber@X.Y.Z ones
      TAG_MATCH: 'v*.*.*'
      # Version switcher: master is served at the root, any other branch at /<branch>
      VERSION_URL_TEMPLATE: 'https://r3f.docs.pmnd.rs/{branch}'
      VERSION_PRODUCTION_BRANCH: 'master'
      VERSION_PRODUCTION_URL: 'https://r3f.docs.pmnd.rs'

    steps:
      # Full history and tags for the version label (`git describe --tags`), but blobless: past
      # file contents are not fetched, only the checked-out commit's
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/checkout@v6
        with:
          ref: v10
          path: v10
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Built first, so that master's switcher offers v10 only when it was built: a broken v10
      # build must never hold back the master docs.
      - name: Build v10 docs
        id: v10
        continue-on-error: true
        working-directory: v10
        # @pmndrs/docs reads the current branch from GITHUB_REF_NAME, which is `master` in this
        # run. GITHUB_* variables can't be overridden in `env:`, hence on the command line.
        run: GITHUB_REF_NAME=v10 npx -y @pmndrs/docs@4 build docs ../_site/v10 --format website
        env:
          BASE_PATH: /v10
          NEXT_PUBLIC_URL: https://r3f.docs.pmnd.rs/v10
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/v10/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/v10
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/v10/docs
          VERSION_BRANCHES_LIST: master v10

      - name: Deploy without v10 docs
        if: steps.v10.outcome != 'success'
        run: |
          echo "::warning::v10 docs failed to build; deploying master docs only"
          rm -rf _site/v10

      - name: Build master docs
        run: npx -y @pmndrs/docs@4 build docs _site --format website
        env:
          NEXT_PUBLIC_URL: https://r3f.docs.pmnd.rs
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/master/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/master
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/master/docs
          VERSION_BRANCHES_LIST: ${{ steps.v10.outcome == 'success' && 'master v10' || 'master' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
